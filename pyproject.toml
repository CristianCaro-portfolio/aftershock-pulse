[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aftershock-pulse"
version = "0.1.0"
description = "Aftershock detection and forecasting from citizen seismometers and open networks, measured on the 2026 M7.7 Panama sequence"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cristian Caro" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "obspy>=1.4",
  "zarr>=3.0",
]

[project.optional-dependencies]
tracking = ["mlflow-skinny>=3.0", "alembic>=1.13", "sqlalchemy>=2.0"]
dev = ["pytest>=8", "ruff>=0.6", "mlflow-skinny>=3.0", "alembic>=1.13", "sqlalchemy>=2.0"]

[project.scripts]
aftershock-pulse = "aftershock_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["aftershock_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
